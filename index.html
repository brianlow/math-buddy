<title>Math Buddies</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Math Buddies">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Grandstander:wght@700;900&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: a storybook island map; places open story chats, puzzles and gentle "cheer-up" challenges. One deliberate daytime look. */
:root{
  --sea:#4cb8c4; --sea-deep:#2f93a6; --sand:#f5dc96; --grass:#8fcf63;
  --ink:#2b2950; --paper:#fffaf0; --page:#fff1cf; --coral:#ff7a59; --sun:#ffd23f;
  --mint:#7fd6b5; --pink:#ff9ec2; --lilac:#b9a6ff; --muted:#5f5c86; --grey:#e7e1cf;
  --display:"Grandstander","Chalkboard SE","Comic Sans MS",system-ui,sans-serif;
  --body:"Nunito","Avenir Next",-apple-system,system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--body);font-weight:700;
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:4px dashed var(--ink);outline-offset:3px}

.app{height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 10px;box-sizing:border-box;
  background:radial-gradient(circle at 20% 10%,#62c7d2 0 30%,transparent 60%),var(--sea)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap}
.logo{font:900 clamp(24px,3.6vw,38px)/1 var(--display);color:#fff;letter-spacing:.01em;
  text-shadow:0 3px 0 var(--ink),2px 0 0 var(--ink),-2px 0 0 var(--ink),0 -2px 0 var(--ink)}
.hud{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.pill{border:3px solid var(--ink);background:var(--paper);border-radius:999px;padding:.45em .95em;font-weight:900;font-size:16px;
  box-shadow:0 4px 0 var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:.4em;transition:transform .08s}
.pill:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.pill:disabled{opacity:.45;cursor:default}
.pill.sun{background:var(--sun)}
.pill.mint{background:var(--mint)}
.pill.big{font-size:20px;padding:.65em 1.3em}
.chip{font-size:15px;padding:.4em .8em}
.chip b{font-variant-numeric:tabular-nums;font-size:17px}
.ic{width:1.3em;height:1.3em;display:block;flex:none}
.xpbar{display:block;width:54px;height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--mint)}
.gems{gap:2px}
.gems .ic{width:1.15em;height:1.15em}

.map-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;container-type:size;margin-top:8px}
.map{position:relative;width:min(100cqw,calc(100cqh * 10 / 7));aspect-ratio:10/7;max-width:100%;border-radius:28px;overflow:hidden;
  border:4px solid var(--ink);box-shadow:0 6px 0 var(--ink)}
.map-art{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:0}
.tint{position:absolute;inset:0;z-index:1;pointer-events:none;transition:background 1s}
.tint.t0{background:rgba(255,190,140,.12)}
.tint.t2{background:rgba(255,110,60,.2)}
.tint.t3{background:rgba(22,22,84,.46)}
.zone{position:absolute;z-index:2;width:15%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:transparent;border-radius:50%;padding:0}
.zone .tag{position:absolute;left:50%;bottom:-2%;transform:translateX(-50%);white-space:nowrap;background:var(--paper);
  font:900 clamp(10px,1.55cqw,17px)/1 var(--body);padding:.45em .75em;border-radius:999px;border:3px solid var(--ink);
  box-shadow:0 3px 0 var(--ink);display:flex;gap:.35em;align-items:center}
.zone .tag .ic{width:1.1em;height:1.1em}
.zone .bang{position:absolute;right:6%;top:4%;width:30%;aspect-ratio:1;border-radius:50%;background:var(--sun);border:3px solid var(--ink);
  font:900 clamp(12px,2cqw,22px)/1 var(--display);display:grid;place-items:center;animation:bounce 1.2s ease-in-out infinite}
.zone.locked .tag{background:#e9e3d0;color:#7b7690}
@keyframes bounce{50%{transform:translateY(-18%)}}
.mapbtn{position:absolute;z-index:3;width:5.2%;aspect-ratio:1;transform:translate(-50%,-50%);border:0;background:none;padding:0}
.mapbtn svg{width:100%;height:100%;display:block}
.treasure svg{animation:twinkle 1.8s ease-in-out infinite}
.critter svg{animation:wiggle3 2.2s ease-in-out infinite;filter:drop-shadow(0 2px 0 rgba(43,41,80,.35))}
.dig svg{animation:none}
@keyframes twinkle{50%{transform:scale(.7) rotate(20deg);opacity:.6}}
@keyframes wiggle3{0%,70%,100%{transform:rotate(0)}78%{transform:rotate(-14deg)}86%{transform:rotate(14deg)}94%{transform:rotate(-6deg)}}
.map-buddy,.map-pal{position:absolute;z-index:4;transform:translate(-50%,-82%);transition-property:left,top;transition-timing-function:ease-in-out;pointer-events:none}
.map-buddy{width:11%}
.map-pal{width:6.5%;transition-delay:.15s}
.walking .buddy-svg,.walking .face-svg{animation:hop .3s ease-in-out infinite}
.quest-tip{margin:8px 0 0;display:flex;justify-content:center}
.quest-tip span{background:rgba(255,250,240,.92);border:3px solid var(--ink);border-radius:16px;padding:6px 14px;font-weight:900;font-size:16px;text-align:center;text-wrap:balance;max-width:900px}

.buddy-svg,.face-svg{display:block;width:100%;height:auto;overflow:visible;animation:bob 2.6s ease-in-out infinite;transform-origin:50% 100%}
.yay .buddy-svg{animation:jump .5s ease-out}
@keyframes bob{50%{transform:translateY(-3%) scaleY(1.02)}}
@keyframes hop{50%{transform:translateY(-14%)}}
@keyframes jump{30%{transform:translateY(-16%) scale(1.04,.96)}60%{transform:translateY(0) scale(.96,1.04)}}
@keyframes wiggle{25%{transform:translateX(-50%) rotate(-6deg)}75%{transform:translateX(-50%) rotate(6deg)}}

.overlay{position:fixed;inset:0;z-index:20;overflow-y:auto;background:var(--page);
  background-image:radial-gradient(#f3dea8 1.6px,transparent 1.8px);background-size:22px 22px;
  padding:calc(env(safe-area-inset-top,0px) + 12px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 24px) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.play-top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1100px;margin:0 auto 14px}
.play-top h2{margin:0;font:900 clamp(22px,3.4vw,34px)/1.1 var(--display);text-align:center;text-wrap:balance}
.play-top h2 small{display:block;font:800 14px/1.3 var(--body);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.spacer{width:96px;flex:none}
.progress{display:flex;gap:6px;min-width:96px;justify-content:flex-end}
.progress i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:var(--paper);display:block;box-sizing:border-box}
.progress i.now{background:var(--sun)}
.progress i.done{border:0;background:none}
.progress i.done .ic{width:22px;height:22px}
.progress i.miss{background:#d9d3c0}

.play-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.8fr);gap:24px;max-width:1100px;margin:0 auto;align-items:start}
.buddy-side{display:flex;flex-direction:column;align-items:center;gap:10px;position:sticky;top:0}
.buddy-big{width:min(240px,100%)}
.duo{display:flex;align-items:flex-end;justify-content:center;gap:4px;width:100%}
.duo .buddy-big{width:min(200px,70%)}
.duo .pal{width:min(90px,28%)}
.bubble{position:relative;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:12px 16px;font-size:19px;font-weight:900;
  text-align:center;min-height:1.4em;max-width:300px;text-wrap:balance}
.bubble::after{content:"";position:absolute;left:50%;bottom:-13px;width:20px;height:20px;background:#fff;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:translateX(-50%) rotate(45deg)}
.streak{font:900 16px/1 var(--display);color:var(--coral);min-height:1em}

.foe-box{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%}
.foe{width:min(210px,70%)}
.foe.hit .face-svg{animation:shake .4s}
.foe-name{font:900 20px/1.1 var(--display)}
.meter{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.meter i{display:block;width:26px;height:20px}
.meter i svg{width:100%;height:100%}
.meter i.gone{opacity:.18}
.vs{font:900 14px/1 var(--body);letter-spacing:.1em;color:var(--muted);text-transform:uppercase}

.card{background:var(--paper);border:4px solid var(--ink);border-radius:30px;box-shadow:0 7px 0 var(--ink);padding:22px clamp(16px,3vw,32px) 26px;min-width:0}
.prompt{margin:0;font-size:clamp(18px,2.4vw,24px);font-weight:800;color:var(--muted);text-align:center;text-wrap:balance}
.step-prompt{margin:10px 0 0;font-size:clamp(18px,2.3vw,23px);font-weight:900;text-align:center;color:var(--ink)}
.eq{margin:8px 0 6px;text-align:center;font:900 clamp(42px,7.5vw,80px)/1.15 var(--display);font-variant-numeric:tabular-nums;white-space:nowrap;overflow-x:auto}
.eq.small{font-size:clamp(28px,4.8vw,50px);white-space:normal}
.qbox{display:inline-block;min-width:1.1em;padding:0 .1em;border:5px dashed var(--coral);border-radius:16px;color:var(--coral);line-height:1}
.bagq{display:inline-block;min-width:1.1em;padding:0 .12em;border-radius:.3em;background:#9c6bd6;color:#fff;line-height:1.05}
.pic{--d:24px;display:flex;flex-direction:column;align-items:center;gap:8px;margin:6px 0 14px;padding:14px;border-radius:20px;background:#fff;border:3px dashed #e3d4a8;overflow-x:auto}
.pic-note{margin:0;font-size:17px;color:var(--muted);font-weight:800;text-align:center;text-wrap:balance}
.groups{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap}
.grp{display:grid;grid-template-columns:repeat(5,var(--d));gap:6px}
.op{font:900 34px/1 var(--display)}
.dot{display:block;width:var(--d);height:var(--d);border-radius:50%;border:3px solid var(--ink);box-sizing:border-box}
.dot.sqr{border-radius:5px}
.dot.empty{background:#fff;border-style:dashed}
.c1{background:var(--coral)} .c2{background:var(--sea)} .c3{background:var(--grass)} .c4{background:var(--lilac)} .c5{background:var(--sun)}
.dot.gone{background:linear-gradient(45deg,transparent 40%,var(--ink) 40% 60%,transparent 60%),#fff;opacity:.55}
.grid{display:grid;grid-template-columns:repeat(var(--cols),var(--d));gap:calc(var(--d) * .22)}
.cell{display:block;width:var(--d);height:var(--d);border-radius:4px;box-sizing:border-box}
.cell.a{background:var(--coral);border:2px solid var(--ink)} .cell.b{background:var(--sea);border:2px solid var(--ink)}
.cell.dim{opacity:.3}
.blocks{--d:20px;display:flex;gap:6px;align-items:flex-end}
.rod{display:grid;grid-template-rows:repeat(10,calc(var(--d) * .62));width:calc(var(--d) * .95);border:3px solid var(--ink);border-radius:6px;overflow:hidden}
.rod i{display:block;border-bottom:1.5px solid rgba(43,41,80,.35)}
.ones{display:grid;grid-template-columns:repeat(2,var(--d));gap:4px;align-content:end}
.tenframe{display:grid;grid-template-columns:repeat(5,34px);gap:0;border:3px solid var(--ink);border-radius:8px;overflow:hidden}
.tenframe span{width:34px;height:34px;border:1.5px solid var(--ink);display:grid;place-items:center;box-sizing:border-box;background:#fff}
.tenframe span i{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);box-sizing:border-box}
.cmp{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:center}
.cmp b{font-size:16px}
.cmp .row{display:flex;gap:5px}
.plates{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.plate{min-width:84px;min-height:70px;border-radius:50%;background:#fff6dc;border:3px solid var(--ink);display:flex;flex-wrap:wrap;gap:4px;align-content:center;justify-content:center;padding:10px;box-sizing:border-box;max-width:120px}
.berry-pile{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:360px;min-height:28px}
.berry{width:20px;height:20px;border-radius:50%;background:#7b4fd6;border:2.5px solid var(--ink);box-sizing:border-box;position:relative}
.berry::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.7;left:3px;top:3px}
.scale{display:flex;flex-direction:column;align-items:center;width:100%;max-width:520px}
.pans{display:grid;grid-template-columns:1fr 1fr;gap:40px;width:100%}
.pan{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-content:flex-end;min-height:64px;padding:8px 8px 10px;border-bottom:6px solid var(--ink);border-radius:0 0 40px 40px;background:#fff3cf}
.beam{width:86%;height:8px;background:var(--ink);border-radius:4px}
.post{width:10px;height:44px;background:var(--ink)}
.base{width:120px;height:12px;background:var(--ink);border-radius:6px}
.bag{width:46px;height:52px;position:relative}
.bag svg{width:100%;height:100%}
.blk{width:24px;height:24px;border-radius:4px;background:var(--sun);border:2.5px solid var(--ink);box-sizing:border-box}
.seq{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:center}
.seq .tile{min-width:52px;padding:8px 6px;border-radius:12px;border:3px solid var(--ink);background:#fff;font:900 24px/1 var(--display);text-align:center}
.seq .tile.q{color:var(--coral);border-style:dashed;border-color:var(--coral)}
.seq .hopl{font:900 14px/1 var(--body);color:var(--muted)}
.minisq{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;justify-content:center}
.minisq .grid{--d:10px}
.split-wrap{display:flex;flex-direction:column;align-items:center}
.cutrow{display:block;width:100%;height:14px;border:0;padding:0;background:transparent;position:relative;margin:-2px 0}
.cutrow::before{content:"";position:absolute;left:-10px;right:-10px;top:50%;height:4px;margin-top:-2px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--coral) 0 8px,transparent 8px 14px);opacity:.55}
.cutrow:hover::before,.cutrow:focus-visible::before{opacity:1;height:6px;margin-top:-3px}
.cutline{height:6px;width:calc(100% + 24px);background:var(--ink);border-radius:3px;margin:4px 0}
.split-grid .grow{display:flex;gap:calc(var(--d) * .22)}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ans{border:4px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink);padding:16px 8px;font:900 clamp(30px,5vw,50px)/1 var(--display);
  font-variant-numeric:tabular-nums;transition:transform .08s,background .2s}
.ans.word{font-size:clamp(18px,2.6vw,24px);font-family:var(--body)}
.ans:nth-child(1){background:var(--sun)} .ans:nth-child(2){background:var(--mint)} .ans:nth-child(3){background:#9fd3ff} .ans:nth-child(4){background:var(--pink)}
.ans:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.ans:disabled{cursor:default}
.ans.wrong{background:var(--grey);color:#a29d88;border-color:#a29d88;box-shadow:0 6px 0 #a29d88;animation:shake .35s}
.ans.zapped{visibility:hidden}
.ans.right{background:var(--grass);animation:pop .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes pop{50%{transform:scale(1.08)}}
.helpers{display:flex;justify-content:center;gap:10px;margin-top:20px;flex-wrap:wrap}
.helpers .pill{font-size:15px}
.cut-hint{text-align:center;font-size:20px;font-weight:900;margin:6px 0 0;color:var(--coral)}

.done{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.done h3{margin:0;font:900 clamp(32px,5vw,48px)/1.1 var(--display)}
.done p{margin:0;font-size:20px;max-width:30em;text-wrap:balance}
.earned{display:flex;gap:8px}
.earned .ic{width:50px;height:50px}
.loot{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.loot span{display:inline-flex;align-items:center;gap:6px;background:#fff;border:3px solid var(--ink);border-radius:14px;padding:8px 12px;font-size:18px;font-weight:900}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.gift{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:6px;font:900 22px/1.2 var(--display)}
.gift svg{width:120px;animation:wiggle2 1.4s ease-in-out infinite}
@keyframes wiggle2{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-7deg)}80%{transform:rotate(7deg)}90%{transform:rotate(-4deg)}}
.reveal{display:flex;flex-direction:column;align-items:center;gap:8px;animation:pop .5s}
.reveal .buddy-big{width:170px}
.banner{background:var(--sun);border:3px solid var(--ink);border-radius:16px;padding:10px 16px;font-weight:900;font-size:18px}

/* dialog */
.dlg-back{position:fixed;inset:0;z-index:30;background:rgba(43,41,80,.28);display:flex;align-items:flex-end;justify-content:center;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px))}
.dlg{width:min(860px,100%);background:var(--paper);border:4px solid var(--ink);border-radius:28px;box-shadow:0 7px 0 var(--ink);
  display:grid;grid-template-columns:150px minmax(0,1fr);gap:18px;padding:18px 22px;box-sizing:border-box;animation:slideup .25s ease-out;max-height:calc(100vh - 40px);overflow-y:auto}
@keyframes slideup{from{transform:translateY(30px);opacity:0}}
.dlg-face{align-self:center}
.dlg-name{font:900 15px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.dlg-text{margin:6px 0 0;font-size:clamp(20px,2.6vw,26px);font-weight:900;line-height:1.3;text-wrap:pretty}
.dlg-extra:not(:empty){margin-top:12px}
.dlg-extra .eq{font-size:clamp(34px,5.5vw,56px);margin:0}
.dlg-extra .answers{gap:10px}
.dlg-extra .ans{padding:12px 6px;font-size:clamp(26px,4vw,40px)}
.dlg-btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:flex-end}
.dlg-btns .choice{font-size:18px;padding:.6em 1.1em}
.dlg-btns .choice.star{background:var(--sun)}
.dlg-btns .ghost{margin-right:auto}
.got{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:20px;font-weight:900}
.got svg{width:56px;height:56px;flex:none}

/* my buddy */
.me-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:24px;max-width:1100px;margin:0 auto;align-items:start}
.me-side{display:flex;flex-direction:column;align-items:center;gap:12px;position:sticky;top:0}
.me-side .buddy-big{width:min(220px,100%)}
.name-field{display:flex;flex-direction:column;gap:6px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);align-items:center}
.name-field input{font:900 24px/1 var(--display);text-align:center;width:220px;max-width:100%;padding:10px 12px;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink);-webkit-user-select:text;user-select:text}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab[aria-selected="true"]{background:var(--sun)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.tile{position:relative;border:3px solid var(--ink);border-radius:20px;background:#fff;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;
  box-shadow:0 4px 0 var(--ink);font-weight:900;font-size:14px;text-align:center}
.tile .mini{width:78px}
.tile .swatch{width:62px;height:62px;border-radius:50%;border:3px solid var(--ink);margin:7px 0}
.tile.on{background:var(--sun)}
.tile.armed{background:var(--mint)}
.tile.locked{background:#eee8d6;color:#8f8a76;border-color:#9a9480;box-shadow:0 4px 0 #9a9480;cursor:default}
.tile.locked .q{width:64px;height:76px;display:grid;place-items:center;font:900 44px/1 var(--display)}
.tile small{font-size:12px;color:var(--muted);font-weight:800}
.tile .price{display:inline-flex;align-items:center;gap:3px;font-size:15px}
.tile .price .ic{width:1.1em;height:1.1em}
.bonus{display:inline-block;background:var(--lilac);border-radius:8px;padding:2px 6px;font-size:12px;color:var(--ink)}
.note{color:var(--muted);font-size:16px;margin:16px 0 0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.ccard{border:3px solid var(--ink);border-radius:22px;background:#fff;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;box-shadow:0 4px 0 var(--ink)}
.ccard.on{background:var(--sun)}
.ccard .mini{width:110px}
.ccard h4{margin:0;font:900 24px/1 var(--display)}
.ccard p{margin:0;font-size:15px;color:var(--muted);text-wrap:balance}
.statrow{display:grid;grid-template-columns:120px auto minmax(0,1fr);gap:12px;align-items:center;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:12px 16px}
.statrow b{font:900 22px/1 var(--display)}
.statrow .num{font:900 30px/1 var(--display);font-variant-numeric:tabular-nums}
.statrow p{margin:0;color:var(--muted);font-size:15px}
.stack{display:flex;flex-direction:column;gap:12px}
.hero-head{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px 18px}
.hero-head h3{margin:0;font:900 28px/1.1 var(--display)}
.bigxp{width:220px;height:16px;border:3px solid var(--ink);border-radius:9px;background:#fff;overflow:hidden}
.bigxp i{display:block;height:100%;background:var(--mint)}
.crit-tile svg{width:64px;height:64px}
.crit-tile.unknown svg{filter:brightness(0);opacity:.25}

/* level up */
.modal-back{position:fixed;inset:0;z-index:45;background:rgba(43,41,80,.45);display:grid;place-items:center;padding:16px}
.modal{width:min(620px,100%);background:var(--paper);border:4px solid var(--ink);border-radius:30px;box-shadow:0 7px 0 var(--ink);padding:22px;box-sizing:border-box;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:pop .45s}
.modal h3{margin:0;font:900 clamp(32px,5vw,46px)/1 var(--display)}
.modal p{margin:0;font-size:18px}
.modal .buddy-big{width:150px}
.lv-choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.lv-choices button{border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 4px 0 var(--ink);padding:12px 8px;display:flex;flex-direction:column;gap:4px;align-items:center}
.lv-choices button b{font:900 22px/1 var(--display)}
.lv-choices button span{font-size:13px;color:var(--muted)}

.dev-body{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.dev-body .pill{font-size:17px;padding:.7em 1em}
.dev-body .danger{background:#ffb3a6}
.dev-body .note{text-align:center;margin:4px 0 0}
.dev-body h4{margin:10px 0 0;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 24px);transform:translateX(-50%);z-index:60;background:var(--ink);color:#fff;
  padding:14px 22px;border-radius:18px;font-weight:900;font-size:18px;max-width:min(90vw,560px);text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.spark{position:fixed;width:12px;height:12px;border-radius:3px;z-index:70;pointer-events:none;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.floaty{position:fixed;z-index:70;pointer-events:none;font:900 22px/1 var(--display);color:var(--ink);background:var(--sun);border:3px solid var(--ink);border-radius:12px;padding:4px 8px;animation:floaty 1.1s ease-out forwards}
@keyframes floaty{to{transform:translateY(-60px);opacity:0}}
.flyer{position:fixed;z-index:70;width:34px;height:34px;pointer-events:none;transition:transform .45s cubic-bezier(.4,-.3,.6,1)}

.dlg-face svg,.ccard span svg,.got svg{width:100%;height:auto;display:block}
.split-wrap{gap:3px}
.ccard>span{display:block}
.duo .pal .face-svg{animation-delay:-1s}
@media (max-width:760px){
  .play-body,.me-body{grid-template-columns:1fr;gap:14px}
  .buddy-side{position:static}
  .buddy-big{width:120px}
  .duo .buddy-big{width:110px}.duo .pal{width:60px}
  .foe{width:120px}
  .bubble{font-size:16px}
  .me-side{position:static}.me-side .buddy-big{width:150px}
  .progress i{width:16px;height:16px}
  .dlg{grid-template-columns:80px minmax(0,1fr);gap:12px;padding:14px}
  .lv-choices{grid-template-columns:1fr}
  .statrow{grid-template-columns:90px auto minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

let actx;
function tone(fs,dur=.12,type='sine',vol=.16){
  if(!S.sound)return;
  try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();
    const t=actx.currentTime;fs.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;
      const s=t+i*dur;g.gain.setValueAtTime(0,s);g.gain.linearRampToValueAtTime(vol,s+.01);g.gain.exponentialRampToValueAtTime(.001,s+dur*1.8);
      o.connect(g).connect(actx.destination);o.start(s);o.stop(s+dur*2)})}catch(e){}
}

/* ---------- questions ---------- */
function near(ans,extra=[]){
  const s=new Set([ans]);
  for(const v of shuffle([...extra,ans+1,ans-1,ans+2,ans-2,ans+3,ans+10])){if(s.size>=4)break;if(v>=0&&Number.isInteger(v)&&v!==ans)s.add(v)}
  let k=4;while(s.size<4)s.add(ans+k++);
  return shuffle([...s]);
}
const mc=o=>({kind:'mc',opts:o.opts||near(o.ans,o.extra||[]),...o});

    steps:[{prompt:`Orange part: ${r1} ${r1===1?'row':'rows'} of ${c1}`,eq:`${r1} × ${c1} = ?`,ans:A,hl:'a'},
           {prompt:`Blue part: ${r2} rows of ${c2}`,eq:`${r2} × ${c2} = ?`,ans:B,hl:'b'},

function splitSteps(q,cut){
  const {r,c}=q,t=cut,b=r-cut,A=t*c,B=b*c;
  q.cut=cut;q.kind='steps';
  q.steps=[{prompt:`Top piece: ${t} ${t===1?'row':'rows'} of ${c}`,eq:`${t} × ${c} = ?`,ans:A,hl:'a'},
           {prompt:`Bottom piece: ${b} ${b===1?'row':'rows'} of ${c}`,eq:`${b} × ${c} = ?`,ans:B,hl:'b'},
           {prompt:'Put the pieces back together!',eq:`${A} + ${B} = ?`,ans:A+B,hl:''}];

/* ---------- pictures ---------- */
const dots=(n,c,extra='')=>Array.from({length:n},()=>`<i class="dot ${c} ${extra}"></i>`).join('');
function blocks(n,c){let s='';for(let i=0;i<Math.floor(n/10);i++)s+=`<span class="rod ${c}">${'<i></i>'.repeat(10)}</span>`;return `<div class="blocks">${s}<span class="ones">${dots(n%10,c)}</span></div>`}
const BAG=`<svg viewBox="0 0 36 40" aria-hidden="true"><path d="M10 10 Q4 22 4 30 Q4 38 18 38 Q32 38 32 30 Q32 22 26 10 Z" fill="#9c6bd6" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/><path d="M10 10 L8 4 L14 7 L18 2 L22 7 L28 4 L26 10 Z" fill="#9c6bd6" stroke="${INK}" stroke-width="2.5" stroke-linejoin="round"/><path d="M10 11 H26" stroke="#ffd23f" stroke-width="3"/><text x="18" y="31" text-anchor="middle" font-family="Grandstander, sans-serif" font-weight="900" font-size="15" fill="#fff">?</text></svg>`;
function picHTML(p,q){
  const D=(r,c,max=230)=>Math.min(28,Math.floor(max/Math.max(r,c)));
  switch(p.t){
  case 'add':return `<div class="groups"><div class="grp">${dots(p.a,'c1')}</div><b class="op">+</b><div class="grp">${p.hideB?dots(p.b,'','empty'):dots(p.b,'c2')}</div></div><p class="pic-note">${p.hideB?'Count the empty circles.':'Count them all.'}</p>`;
  case 'blocksadd':return `<div class="groups">${blocks(p.a,'c1')}<b class="op">+</b>${blocks(p.b,'c2')}</div><p class="pic-note">Each tall stick is 10. Add the tens, then the ones.</p>`;
  case 'ten':{let s='';for(let i=0;i<10;i++)s+=`<span>${i<p.a?'<i class="c1"></i>':''}</span>`;return `<div class="tenframe">${s}</div><p class="pic-note">A ten frame holds 10. How many empty boxes?</p>`}
  case 'sub':
    if(p.a<=20){let s='';for(let i=0;i<p.a;i++)s+=`<i class="dot c1 ${i>=p.a-p.b?'gone':''}"></i>`;return `<div class="grp">${s}</div><p class="pic-note">${p.b} crossed out. Count what’s left.</p>`}
    return `${blocks(p.a,'c1')}<p class="pic-note">Start with ${p.a}. Take away ${p.b}. Each tall stick is 10.</p>`;
  case 'compare':return `<div class="cmp"><b>Bun</b><div class="row">${dots(p.a,'c5')}</div><b>Pip</b><div class="row">${dots(p.b,'c4')}</div></div><p class="pic-note">Line them up. How many extra on top?</p>`;
  case 'groups':{const d=p.e>6?18:24;let s='';for(let i=0;i<p.g;i++)s+=`<div class="plate" style="--d:${d}px">${dots(p.e,['c1','c2','c3','c4'][i%4])}</div>`;return `<div class="plates">${s}</div><p class="pic-note">${p.g} groups of ${p.e}</p>`}
  case 'grid':{const d=D(p.r,p.c);return `<div class="grid" style="--cols:${p.c};--d:${d}px">${dots(p.r*p.c,p.sq?'c3':'c2',p.sq?'sqr':'')}</div><p class="pic-note">${p.r} ${p.r===1?'row':'rows'} of ${p.c}</p>`}
  case 'grow':{const m=p.n+1,d=D(m,m);let s='';for(let r=0;r<m;r++)for(let c=0;c<m;c++)s+=`<i class="dot sqr ${r<p.n&&c<p.n?'c3':'c1'}"></i>`;return `<div class="grid" style="--cols:${m};--d:${d}px">${s}</div><p class="pic-note">Green is the old ${p.n} by ${p.n} square. Orange tiles are new.</p>`}
  case 'turn':{const d=20,g=(r,c,cl)=>`<div class="grid" style="--cols:${c};--d:${d}px">${dots(r*c,cl)}</div>`;return `<div class="groups">${g(p.a,p.b,'c2')}<b class="op">=</b>${g(p.b,p.a,'c4')}</div><p class="pic-note">${p.a} rows of ${p.b} turned sideways is ${p.b} rows of ${p.a}.</p>`}
  case 'share':return `<div class="berry-pile" data-pile>${'<i class="berry"></i>'.repeat(p.n)}</div><div class="plates">${'<div class="plate" data-plate></div>'.repeat(p.k)}</div><button class="pill sun" type="button" data-deal>Deal one to each friend</button><p class="pic-note">Keep dealing until the berries are gone.</p>`;
  case 'balance':{const left='<span class="bag">'+BAG+'</span>'.repeat(1);let L='';for(let i=0;i<p.bags;i++)L+=`<span class="bag">${BAG}</span>`;L+='<i class="blk"></i>'.repeat(p.a);return `<div class="scale"><div class="pans"><div class="pan">${L}</div><div class="pan">${'<i class="blk"></i>'.repeat(p.c)}</div></div><div class="beam"></div><div class="post"></div><div class="base"></div></div><p class="pic-note">${p.bags>1?'Both bags hold the same number. ':''}Both sides weigh the same.</p>`}
  case 'seq':{
    let s='';p.seq.forEach((n,i)=>{if(i)s+=`<span class="hopl">${p.sq?'':(p.step>0?'+':'')+p.step}</span>`;s+=`<span class="tile ${i===p.hide?'q':''}">${i===p.hide?'?':n}</span>`});
    let extra='';if(p.sq)extra=`<div class="minisq">${[1,2,3,4,5].map(n=>`<div class="grid" style="--cols:${n}">${dots(n*n,'c3','sqr')}</div>`).join('')}</div>`;
    return `<div class="seq">${s}</div>${extra}<p class="pic-note">${p.sq?'Each one is a bigger square: 1×1, 2×2, 3×3…':'Each jump is the same size.'}</p>`;}
  case 'L':{const cols=p.c2,rows=p.r1+p.r2,d=D(rows,cols,220),hl=q&&q.steps?q.steps[R?R.step:0].hl:'';let s='';
    for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const part=r<p.r1?(c<p.c1?'a':''):'b';s+=part?`<i class="cell ${part} ${hl&&hl!==part?'dim':''}"></i>`:'<i class="cell"></i>'}
    return `<div class="grid" style="--cols:${cols};--d:${d}px">${s}</div>`}
  case 'split':{const d=D(p.r,p.c,210),cut=q&&q.cut,hl=q&&q.steps?q.steps[R.step].hl:'';let s='';

      if(r<p.r-1){if(!cut)s+=`<button class="cutrow" type="button" data-cut="${r+1}" aria-label="Cut after row ${r+1}"></button>`;else if(r+1===cut)s+='<div class="cutline"></div>'}
    }
    return `<div class="split-wrap split-grid" style="--d:${d}px">${s}</div>`}
  }
  return '';
}

/* ---------- little UI helpers ---------- */
function show(id){['play','me','shop','dev'].forEach(o=>$(o).hidden=o!==id);if(id)$(id).scrollTop=0}
let tt;function toast(t,ms=3000){const el=$('toast');el.textContent=t;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,ms)}
function burst(el){
  if(!el||reduced())return;
  const r=el.getBoundingClientRect(),cols=['#ffd23f','#ff7a59','#7fd6b5','#8f7cf0','#ff8fb8'];

    const a=Math.random()*Math.PI*2,d=60+Math.random()*90;s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');s.style.background=cols[i%5];
    document.body.appendChild(s);setTimeout(()=>s.remove(),850)}
}
function floaty(el,text){if(!el)return;const r=el.getBoundingClientRect(),f=document.createElement('span');f.className='floaty';f.textContent=text;f.style.left=(r.left+r.width/2-30)+'px';f.style.top=(r.top-10)+'px';document.body.appendChild(f);setTimeout(()=>f.remove(),1150)}
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const fill=t=>String(t).replace(/\{name\}/g,S.name);
const eqHTML=(eq,bag)=>esc(eq).replace(/\?/g,bag?'<span class="bagq">?</span>':'<span class="qbox">?</span>');
function give(id){if(!S.owned.includes(id))S.owned.push(id)}
function joinPal(id){if(!S.pals.includes(id))S.pals.push(id);S.pal=id;save()}
function reward(sh,xp){S.shells+=sh;gainXP(xp);save();hud()}
function soundLabel(){$('soundBtn').textContent=S.sound?'Sound on':'Sound off';$('soundBtn').setAttribute('aria-pressed',S.sound)}

function hud(){
  $('lvNum').textContent=S.lvl;$('xpFill').style.width=Math.min(100,S.xp/needXP(S.lvl)*100)+'%';
  $('shellCount').textContent=S.shells;

function questHint(){
  if(!F.intro)return 'Captain Gull is waiting for you at the dock.';
  if(F.ending)return `You saved the Lighthouse! Keep exploring. Critters found: ${S.critters.length} of ${CRITTERS.length}. Treasures: ${S.found.length} of ${TREASURES.length}.`;
  const g=gems();
  if(g===4)return 'You have all 4 Light Gems! Go to Gull’s Dock and sail to the Lighthouse.';
  return `Light Gems found: ${g} of 4. Places with a ! need your help. Tap the time to see who comes out at night.`;
}
function hintLine(){
  if(!F.woodsGem)return 'Pip in Berry Woods looked worried about something.';
  if(!F.gardenGem)return 'Grandma Tess in Square Garden needs a helping hand.';
  if(!F.peakGem)return 'Professor Hoot on Mystery Peak knows lots of secrets.';
  if(!F.bridge)return 'One gem flew over the river. Bea the beaver is trying to fix her bridge.';
  if(!F.lantern)return 'The Crystal Cave is very dark. Professor Hoot has a lantern.';

/* ---------- XP & level ups ---------- */
function gainXP(n){S.xp+=n;while(S.xp>=needXP(S.lvl)&&S.lvl<30){S.xp-=needXP(S.lvl);S.lvl++;S.pendingLv++}save();hud()}
async function flushLevelUps(){while(S.pendingLv>0){await levelUpModal(S.lvl-S.pendingLv+1);S.pendingLv--;save()}hud()}
function levelUpModal(lv){return new Promise(res=>{
  sfx.lvl();
  $('modalBox').innerHTML=`<h3>Level ${lv}!</h3><div class="buddy-big">${buddySVG(S.wear)}</div><p>${esc(S.name)} is getting stronger! Pick a power-up.</p>
    <div class="lv-choices">${STATS.map(([k,n,d])=>`<button type="button" data-k="${k}"><b>+1 ${n}</b><span>${d}</span></button>`).join('')}</div>`;
  $('modal').hidden=false;burst($('modalBox'));
  $('modalBox').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{S.pts[b.dataset.k]++;save();sfx.gift();$('modal').hidden=true;toast(`+1 ${cap(b.dataset.k)}!`);res()});
})}

function setSpeaker(who){
  if(typeof who==='object'){$('dlgFace').innerHTML=who.face;$('dlgName').textContent=who.name}
  else{$('dlgFace').innerHTML=who==='me'?buddySVG(S.wear):face(who);$('dlgName').textContent=who==='me'?S.name:WHO[who]}
  $('dlg').hidden=false;
}
function bindRead(t){const b=$('dlgBtns').querySelector('[data-read]');if(b)b.onclick=()=>say(t)}
function line(who,text,o={}){
  return new Promise(res=>{
    setSpeaker(who);const t=fill(text);$('dlgText').textContent=t;$('dlgExtra').innerHTML=o.extra||'';
    $('dlgBtns').innerHTML=`<button class="pill ghost" type="button" data-read>Read it to me</button><button class="pill sun choice" type="button" data-next>${esc(o.btn||'Next')} ›</button>`;
    bindRead(t);$('dlgBtns').querySelector('[data-next]').onclick=()=>{sfx.tap();hush();res()};
  });
}
async function talk(who,lines){for(const l of lines){if(Array.isArray(l))await line(l[0],l[1]);else await line(who,l)}}
function choose(who,text,opts){
  return new Promise(res=>{
    setSpeaker(who);const t=fill(text);$('dlgText').textContent=t;$('dlgExtra').innerHTML='';
    $('dlgBtns').innerHTML=`<button class="pill ghost" type="button" data-read>Read it to me</button>`+opts.map(o=>`<button class="pill choice ${o.star?'star':''}" type="button" data-k="${o.key}">${o.star?'<b>!</b> ':''}${esc(fill(o.label))}</button>`).join('');
    bindRead(t+'. '+opts.map(o=>fill(o.label)).join('. Or, '));
    $('dlgBtns').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{sfx.tap();hush();res(b.dataset.k)});
  });
}
function got(who,text,label,icon){sfx.gift();return line(who,text,{extra:`<div class="got">${icon}<span>${esc(fill(label))}</span></div>`,btn:'Yay'})}
function dlgClose(){$('dlg').hidden=true;hush()}
function ask(who,text,q){
  return new Promise(res=>{
    setSpeaker(who);const t=fill(text);$('dlgText').textContent=t;let tries=0;
    const opts=near(q.ans,q.extra||[]);
    $('dlgExtra').innerHTML=`<div class="eq">${eqHTML(q.eq)}</div>${q.pic?`<div class="pic" data-pic hidden>${picHTML(q.pic,q)}</div>`:''}<div class="answers">${opts.map(v=>`<button class="ans" type="button" data-v="${v}">${v}</button>`).join('')}</div>`;
    $('dlgBtns').innerHTML=`<button class="pill ghost" type="button" data-read>Read it to me</button>${q.pic?'<button class="pill" type="button" data-showpic>Show me a picture</button>':''}`;
    bindRead(t);bindPic($('dlgExtra'));
    const showPic=()=>{const p=$('dlgExtra').querySelector('[data-pic]');if(p)p.hidden=false;const b=$('dlgBtns').querySelector('[data-showpic]');if(b)b.remove()};
    const sp=$('dlgBtns').querySelector('[data-showpic]');if(sp)sp.onclick=()=>{sfx.tap();showPic()};
    $('dlgExtra').querySelectorAll('.ans').forEach(b=>b.onclick=()=>{
      if(b.disabled)return;
      if(+b.dataset.v===q.ans){sfx.ok();burst(b);b.classList.add('right');$('dlgExtra').querySelectorAll('.ans').forEach(x=>x.disabled=true);const box=$('dlgExtra').querySelector('.qbox');if(box)box.textContent=q.ans;setTimeout(()=>res(tries),800)}
      else{sfx.no();tries++;b.disabled=true;b.classList.add('wrong');showPic();$('dlgText').textContent=pick(OOPS)}
    });
  });
}
function bindPic(root){
  const btn=root.querySelector('[data-deal]');
  if(btn)btn.onclick=()=>{const pile=root.querySelector('[data-pile]');const plates=[...root.querySelectorAll('[data-plate]')];
    for(const pl of plates){const b=pile.querySelector('.berry');if(!b)break;pl.appendChild(b)}
    sfx.tap();if(!pile.querySelector('.berry')){btn.disabled=true;btn.textContent='All shared!'}};
}

/* ---------- rounds & challenges ---------- */
const YES=['You got it!','Super thinking!','Yes! That’s right.','Wow, nice one!','Math power!','You’re on fire!','Brain sparkles!'];
const OOPS=['Not quite. Try again!','So close! Look at the picture.','Let’s count together.','Good try! Pick another one.'];
const TAUNTS={bramble:['Hmph! Still prickly!','Nope! Still tangled!'],weed:['Wiggle wiggle, nope!','Ha! Try again!'],sprite:['Whoosh! Missed me!','Hee hee, try again!'],golem:['Grrr... wrong rock.','Rumble! Try again.'],fog:['Ha! Still foggy!','Nope! Gobble gobble!']};
const CHEERS=['It’s smiling a little!','The grumpy cloud shrinks!','Keep cheering!','It’s starting to giggle!'];
let R=null,playRes=null;
function play(cfg){
  return new Promise(res=>{
    playRes=res;const st=stats();
    R={cfg,i:0,first:0,marks:[],streak:0,best:0,step:0,tries:0,shells:0,xp:0,
      zaps:st.brains+(S.pal==='hoot'?1:0),hops:S.pal==='bun'?2:0,echo:S.pal==='echo'?1:0,hp:cfg.hp||0,meter:cfg.hp||0};
    dlgClose();show('play');
    $('playTitle').innerHTML=`<small>${esc(cfg.sub||'')}</small>${esc(cfg.title)}`;
    renderSide(cfg.bubble||'Let’s go!');
    nextQ();
  });
}
function endPlay(result){const r=playRes;playRes=null;R=null;hush();if(result){S.rounds++;S.time=(S.time+1)%4;save()}show(null);hud();r&&r(result)}
const meterHTML=()=>Array.from({length:R.hp},(_,i)=>`<i class="${i>=R.meter?'gone':''}">${CLOUD()}</i>`).join('');
function renderSide(msg){
  const c=R.cfg,pal=S.pal?`<div class="pal">${face(S.pal)}</div>`:'';
  let h='';
  if(c.foe)h+=`<div class="foe-box"><div class="foe-name">${FOES[c.foe].name}</div><div class="foe" id="foe">${foeSVG(c.foe,R.meter<=0)}</div><div class="meter" id="meter" aria-label="Grumpy meter">${meterHTML()}</div><div class="vs">Grumpy meter</div></div>`;
  h+=`<div class="bubble" id="bubble">${esc(msg)}</div><div class="duo"><div class="buddy-big" id="playBuddy">${buddySVG(S.wear)}</div>${pal}</div><div class="streak" id="streak"></div>`;
  $('side').innerHTML=h;
}
function bubble(t){const b=$('bubble');if(b)b.textContent=t}
function progress(){
  if(!R.cfg.n){$('progress').innerHTML='';return}
  let h='';for(let i=0;i<R.cfg.n;i++){const m=R.marks[i];h+=m===1?`<i class="done">${STAR()}</i>`:m===0?'<i class="miss"></i>':`<i class="${i===R.i?'now':''}"></i>`}
  $('progress').innerHTML=h;
}
function nextQ(){
  if(!R)return;
  if(R.cfg.foe?R.meter<=0:R.i>=R.cfg.n)return finish();
  R.q=R.cfg.gen();R.step=0;R.tries=0;R.pic=!!R.q.show;
  progress();renderQ();
  if(R.q.kind==='split')bubble('Tip: cut off 5 rows, 2 rows or 10 rows. Those are easy!');
}
function cur(){const q=R.q;return q.steps?q.steps[R.step]:q}
function renderQ(){
  const q=R.q,st=q.steps?q.steps[R.step]:null,needCut=q.kind==='split'&&!q.cut;
  if(st&&!st.opts)st.opts=near(st.ans,[st.ans+10,st.ans-10]);
  const opts=st?st.opts:(q.opts||[]),eq=st?st.eq:q.eq,picShown=R.pic||!!st||needCut;
  let h=`<p class="prompt">${esc(q.prompt)}</p>`;
  if(st)h+=`<p class="step-prompt">Step ${R.step+1} of ${q.steps.length}: ${esc(st.prompt)}</p>`;
  h+=`<div class="eq ${q.small?'small':''}">${eqHTML(eq,q.bag&&!st)}</div>`;
  h+=`<div class="pic" id="pic" ${picShown?'':'hidden'}>${picHTML(q.pic,q)}</div>`;
  if(needCut)h+='<p class="cut-hint">Tap a dashed line to cut the wall in two!</p>';
  else h+=`<div class="answers">${opts.map(v=>`<button class="ans" type="button" data-v="${v}">${v}</button>`).join('')}</div>`;
  h+='<div class="helpers">';
  if(!picShown)h+='<button class="pill" type="button" data-help>Show me a picture</button>';
  if(!needCut&&R.zaps>0)h+=`<button class="pill" type="button" data-zap>Zap a wrong one (${R.zaps})</button>`;
  if(R.hops>0&&!st&&!needCut)h+=`<button class="pill" type="button" data-hop>Bun hop: new question (${R.hops})</button>`;
  h+='<button class="pill" type="button" data-read>Read it to me</button>';
  if(S.devSkip)h+='<button class="pill" type="button" data-skip>Skip to end</button>';
  h+='</div>';
  const card=$('card');card.innerHTML=h;
  card.querySelectorAll('.ans').forEach(b=>b.onclick=()=>answer(b.dataset.v,b));
  card.querySelectorAll('[data-cut]').forEach(b=>b.onclick=()=>{sfx.zap();splitSteps(q,+b.dataset.cut);bubble(`Snip! ${q.cut} rows and ${q.r-q.cut} rows. Now solve each piece.`);renderQ()});
  bindPic(card);
  const on=(sel,fn)=>{const b=card.querySelector(sel);if(b)b.onclick=fn};
  on('[data-help]',()=>{sfx.tap();R.pic=true;$('pic').hidden=false;card.querySelector('[data-help]').remove()});
  on('[data-zap]',()=>{const c=cur();const wrong=[...card.querySelectorAll('.ans')].filter(b=>!b.disabled&&String(b.dataset.v)!==String(c.ans));if(!wrong.length)return;const b=pick(wrong);b.disabled=true;b.classList.add('zapped');R.zaps--;sfx.zap();burst(b);const z=card.querySelector('[data-zap]');if(R.zaps>0)z.textContent=`Zap a wrong one (${R.zaps})`;else z.remove()});
  on('[data-hop]',()=>{R.hops--;sfx.tap();R.q=R.cfg.gen();R.step=0;R.tries=0;R.pic=!!R.q.show;bubble('Boing! Bun hopped in a new one.');renderQ()});
  on('[data-read]',()=>say((q.say||q.prompt)+(st?'. '+st.prompt+'. '+st.eq.replace('?','what'):'')));
  on('[data-skip]',()=>{if(R.cfg.foe)R.meter=0;else R.i=R.cfg.n;finish()});
}
function answer(v,btn){
  if(!R||btn.disabled)return;
  const q=R.q,st=q.steps?q.steps[R.step]:null,ans=st?st.ans:q.ans;
  if(String(v)===String(ans)){
    sfx.ok();burst(btn);btn.classList.add('right');
    $('card').querySelectorAll('.ans').forEach(b=>b.disabled=true);
    const box=$('card').querySelector('.qbox, .bagq');if(box)box.textContent=ans;
    if(st&&R.step<q.steps.length-1){R.step++;bubble(pick(['Yes! Next step.','Good! Keep going.','Right! On to the next piece.']));setTimeout(()=>{if(R&&R.q===q)renderQ()},850);return}
    solved(btn);
  }else{
    sfx.no();R.tries++;btn.disabled=true;btn.classList.add('wrong');R.streak=0;streakShow();
    bubble(R.cfg.foe?pick(TAUNTS[R.cfg.foe]):pick(OOPS));
    R.pic=true;const p=$('pic');if(p)p.hidden=false;const hb=$('card').querySelector('[data-help]');if(hb)hb.remove();
  }
}
function streakShow(){const s=$('streak');if(s)s.textContent=R.streak>=3?`${R.streak} in a row!`:''}
function solved(btn){
  const q=R.q,st=stats();let clean=R.tries===0;
  if(!clean&&R.tries===1&&R.echo>0){R.echo--;clean=true;toast('Echo! Echo! That still counts as a star.')}
  let sh=1+(S.pal==='pip'?1:0);const lucky=Math.random()<st.luck*0.1;if(lucky)sh++;
  R.shells+=sh;S.shells+=sh;sfx.coin();floaty(btn,lucky?`Lucky! +${sh}`:`+${sh}`);
  const xp=clean?10:5;R.xp+=xp;gainXP(xp);
  if(clean){R.first++;R.streak++;R.best=Math.max(R.best,R.streak)}
  R.marks[R.i]=clean?1:0;R.i++;
  const pb=$('playBuddy');if(pb){pb.classList.remove('yay');void pb.offsetWidth;pb.classList.add('yay')}
  streakShow();progress();
  let delay=1300;
  if(q.final){bubble(q.final);delay=2400}else bubble(clean?pick(YES):'Yes! You figured it out.');
  if(R.cfg.foe){
    const crit=Math.random()<st.power*0.12,hit=crit?2:1;R.meter=Math.max(0,R.meter-hit);sfx.cheer();
    const foe=$('foe');if(foe){foe.classList.remove('hit');void foe.offsetWidth;foe.classList.add('hit');burst(foe)}
    const m=$('meter');if(m)m.innerHTML=meterHTML();
    if(crit){floaty(foe,'Super Cheer!');if(!q.final)bubble('Super Cheer! Double power!')}else if(!q.final)bubble(pick(CHEERS));
  }
  save();
  setTimeout(()=>{if(R&&R.q===q)nextQ()},delay);
}
function finish(){
  const c=R.cfg,res={first:R.first,n:c.n,win:!!c.foe};
  let h='',extra='';
  if(c.foe){
    gainXP(30);R.xp+=30;S.shells+=5;R.shells+=5;
    renderSide('Yay! We did it!');
    h=`<div class="done"><h3>You cheered up the ${FOES[c.foe].name}!</h3><p>No more grumpy clouds. Every right answer helped.</p>`;
  }else{
    let msg='';
    if(c.place){const L=S.levels[c.place];
      if(R.first>=4&&L<3){S.levels[c.place]=L+1;msg='Great job! Next time will be a little trickier.'}
      else if(R.first<=2&&L>1){S.levels[c.place]=L-1;msg='Next time we’ll practice some easier ones.'}}
    if(!msg)msg=R.first===c.n?'Every one right on the first try!':'Nice work. Keep practicing!';
    if(S.pal==='misty'){S.shells+=3;R.shells+=3;extra+='<div class="banner">Misty rained down 3 bonus shells!</div>'}
    let earned='';for(let i=0;i<c.n;i++)earned+=STAR(i<R.first?'#ffd23f':'#e7e1cf');
    h=`<div class="done"><h3>${c.n>3?'Round done!':'All done!'}</h3><div class="earned" aria-label="${R.first} stars">${earned}</div><p>${msg}</p>`;
    if(c.present&&R.first>=4){
      const left=ITEMS.filter(i=>i.src==='shop'&&!S.owned.includes(i.id));
      const gift=left.length?pick(left):null;
      if(gift){give(gift.id);R.gift=gift}else{S.shells+=5;R.shells+=5}
    }
  }
  h+=`<div class="loot"><span>${SHELL} +${R.shells} shells</span><span>+${R.xp} XP</span>${R.best>=3?`<span>Best streak: ${R.best}</span>`:''}</div>${extra}`;
  if(R.gift)h+=`<div id="giftSpot"><button class="gift" id="giftBtn" type="button"><svg viewBox="0 0 120 110" aria-hidden="true"><rect x="14" y="44" width="92" height="62" rx="8" fill="#ff7a59" stroke="${INK}" stroke-width="4"/><rect x="6" y="28" width="108" height="22" rx="6" fill="#ff9ec2" stroke="${INK}" stroke-width="4"/><rect x="52" y="28" width="16" height="78" fill="#ffd23f" stroke="${INK}" stroke-width="4"/><path d="M60 28 C40 0 20 14 34 26 Z M60 28 C80 0 100 14 86 26 Z" fill="#ffd23f" stroke="${INK}" stroke-width="4" stroke-linejoin="round"/></svg>Super round! Tap your present!</button></div>`;
  h+=`<div class="row"><button class="pill big sun" id="contBtn" type="button">Continue ›</button></div></div>`;
  $('card').innerHTML=h;$('progress').innerHTML=c.n?$('progress').innerHTML:'';
  save();hud();sfx.gift();burst($('card').querySelector('h3'));
  const gift=R.gift;
  if(gift)$('giftBtn').onclick=()=>{sfx.gift();burst($('giftBtn'));
    $('giftSpot').innerHTML=`<div class="reveal"><div class="buddy-big">${buddySVG({...S.wear,[gift.slot]:gift.id})}</div><p>You got: <b>${esc(gift.name)}</b>!</p><button class="pill sun" id="wearBtn" type="button">Wear it</button></div>`;
    $('wearBtn').onclick=()=>{S.wear[gift.slot]=gift.id;save();$('playBuddy').innerHTML=buddySVG(S.wear);$('wearBtn').outerHTML='<p><b>Looking good!</b></p>';sfx.tap()}};
  $('contBtn').onclick=async()=>{sfx.tap();await flushLevelUps();endPlay(res)};
}
$('backBtn').onclick=()=>{sfx.tap();if(playRes)endPlay(null);else show(null)};
const fight=(foe,gen,hp)=>play({title:FOES[foe].name,sub:'Cheer-up challenge',foe,hp,gen,bubble:'Every right answer cheers it up. No rush!'});
const foeWho=k=>({face:foeSVG(k,true),name:FOES[k].name});
function practice(pid){const P=place(pid);return play({title:P.name,sub:`Practice ${P.skill} · Level ${S.levels[pid]}`,gen:()=>G[pick(P.pool)](S.levels[pid]),n:5,place:pid,present:1,bubble:`Let’s practice ${P.skill}!`})}

/* ---------- the story ---------- */
const QUESTS={
  async dock(){
    if(!F.intro)return intro();
    const g=gems();
    if(F.ending){const k=await choose('gull','The Lighthouse shines bright again, thanks to you, {name}!',[{key:'sail',label:'Sail to the Lighthouse'},{key:'bye',label:'Bye, Captain!'}]);if(k==='sail')return lighthouse();return}
    if(g===4){const k=await choose('gull','Shiver me whiskers! You found all four Light Gems! Ready to sail to the Lighthouse?',[{key:'sail',label:'All aboard!',star:1},{key:'bye',label:'Not yet'}]);if(k==='sail')return lighthouse();return}
    await talk('gull',[`You have ${g} of 4 Light Gems. Keep going, matey!`,hintLine()]);
  },
  async village(){
    const k=await choose('shelly',pick(['Welcome to Seaside Village! I sell the finest clothes on the island.','Shells for style! Come and take a look.']),[{key:'shop',label:'Visit Shelly’s shop',star:0},{key:'rest',label:'Sleep at the inn until morning'},{key:'bye',label:'Bye!'}]);
    if(k==='shop')return openShop();
    if(k==='rest'){S.time=0;save();renderMap();hud();await talk('shelly',['Good morning, sleepyhead! Different critters come out at different times of day.'])}
  },
  async meadow(){
    const opts=[];if(!F.shovel)opts.push({key:'q',label:'Help Bun find her carrots',star:1});
    opts.push({key:'p',label:'Practice adding'},{key:'bye',label:'Bye!'});
    const greet=!F.shovel?'Hi! I’m Bun. Oh no, oh no! The storm buried all my carrots!':(F.pip==='return'?'Hop hop! Thanks again for bringing back my berries!':'Hop hop! Want to practice adding with me?');
    const k=await choose('bun',greet,opts);
    if(k==='p')return practice('meadow');
    if(k!=='q')return;
    await talk('bun',['Can you help me count them as I dig them up?']);
    const r=await play({title:'Carrot count',sub:'Plus Meadow',gen:STORY.carrots,n:3,bubble:'Let’s help Bun!'});if(!r)return;
    F.shovel=1;reward(10,40);
    await talk('bun',['You found them all! Thank you, {name}!']);
    await got('bun','Here, take my old shovel. Look for red X marks on the island and dig!','You got a shovel!',ICON.shovel);
  },
  async woods(){
    if(!F.pip){
      const k0=await choose('pip','Psst! I’m Pip. Um... can you keep a secret?',[{key:'q',label:'What’s wrong, Pip?',star:1},{key:'p',label:'Practice taking away'},{key:'bye',label:'Maybe later'}]);
      if(k0==='p')return practice('woods');if(k0!=='q')return;
      await talk('pip',['After the storm I was SO hungry...','I ate a bunch of Bun’s berries. Now I feel bad.']);
      const c=await choose('pip','What should we do?',[{key:'share',label:'Share my snack with Pip'},{key:'return',label:'Help Pip give the berries back'}]);
      if(c==='share'){
        await talk('pip',['Really? You would share with me?','Let’s make it fair. Everyone gets the same!']);
        const r=await play({title:'Snack sharing',sub:'Berry Woods',gen:STORY.snack,n:3,bubble:'Share fair and square! Try dealing them out.'});if(!r)return;
        F.pip='share';joinPal('pip');reward(8,30);
        await talk('pip',['Yum! That was the best snack ever.','You’re a good friend, {name}.']);
        await got('pip','Can I come on your adventure? I’m great at sniffing out shells!','Pip joined your team!',face('pip'));
      }else{
        await talk('pip',['You’re right. Let’s count what I give back.']);
        const r=await play({title:'Berry return',sub:'Berry Woods',gen:STORY.giveback,n:3,bubble:'Let’s make it right!'});if(!r)return;
        F.pip='return';joinPal('bun');reward(8,30);
        await talk('pip',[['bun','My berries! Thank you, Pip. Thank you, {name}!'],['pip','That felt good. Sorry, Bun.']]);
        await got('bun','Can I come on your adventure? I can hop you a new question when one is too tricky!','Bun joined your team!',face('bun'));

  async garden(){

        F.plant=c;reward(8,30);
        await talk('tess',[`Look! The ${nm} are planted. Bees will love them.`]);
      }

/* ---------- map ---------- */
function hasQuest(id){
  switch(id){
    case 'dock':return !F.intro||(gems()===4&&!F.ending);
    case 'meadow':return !F.shovel;
    case 'woods':return !F.woodsGem;
    case 'garden':return !F.gardenGem;
    case 'peak':return !F.peakGem;
    case 'bridge':return !F.bridge;
    case 'cave':return !F.caveGem;
    case 'lighthouse':return gems()===4&&!F.ending;
  }return false;
}
function access(id){
  if(id==='cave'&&!F.bridge)return 'The river is in the way! Bea the beaver at the bridge might help.';
  if(id==='cave'&&!F.lantern)return 'It’s too dark in the Crystal Cave! Maybe Professor Hoot on Mystery Peak has a lantern.';
  if(id==='lighthouse'&&gems()<4&&!F.ending)return 'The Lighthouse is out at sea. Find all 4 Light Gems, then Captain Gull will sail you there.';
  return '';
}
function renderMap(){
  const m=$('map');let h=mapArt()+`<div class="tint t${S.time}"></div>`;
  TREASURES.filter(t=>!S.found.includes(t.id)).forEach(t=>h+=`<button class="mapbtn treasure" type="button" data-t="${t.id}" style="left:${t.x}%;top:${t.y}%" aria-label="Something sparkly">${SPARK}</button>`);
  if(F.shovel)DIGS.filter(d=>!S.dug.includes(d.id)).forEach(d=>h+=`<button class="mapbtn dig" type="button" data-d="${d.id}" style="left:${d.x}%;top:${d.y}%" aria-label="X marks the spot">${XMARK}</button>`);
  CRITTERS.filter(c=>!c.dig&&!S.critters.includes(c.id)&&c.times.includes(S.time)&&(!c.need||c.need())).forEach(c=>h+=`<button class="mapbtn critter" type="button" data-c="${c.id}" style="left:${c.x}%;top:${c.y}%" aria-label="A critter">${critSVG(c.id)}</button>`);
  PLACES.forEach(p=>{
    const locked=!!access(p.id),q=hasQuest(p.id)&&!locked;
    h+=`<button class="zone ${locked?'locked':''}" type="button" data-z="${p.id}" style="left:${p.x}%;top:${p.y}%" aria-label="${p.name}${q?', needs help':''}">${q?'<span class="bang">!</span>':''}<span class="tag">${locked?LOCK:''}${p.name}</span></button>`;
  });
  h+=`<div class="map-buddy" id="mapBuddy">${buddySVG(S.wear)}</div>`;
  if(S.pal)h+=`<div class="map-pal" id="mapPal">${face(S.pal)}</div>`;
  m.innerHTML=h;
  setBuddy(S.pos.x,S.pos.y,0);
  m.querySelectorAll('.zone').forEach(b=>b.onclick=e=>{e.stopPropagation();visit(b.dataset.z)});
  m.querySelectorAll('[data-t]').forEach(b=>b.onclick=e=>{e.stopPropagation();getTreasure(b.dataset.t,b)});
  m.querySelectorAll('[data-d]').forEach(b=>b.onclick=e=>{e.stopPropagation();dig(b.dataset.d)});
  m.querySelectorAll('[data-c]').forEach(b=>b.onclick=e=>{e.stopPropagation();catchCritter(b.dataset.c)});
  m.querySelector('.map-art').onclick=tapGround;
}
function setBuddy(x,y,ms){
  const b=$('mapBuddy');if(!b)return;b.style.transitionDuration=ms+'ms';b.style.left=x+'%';b.style.top=y+'%';
  const p=$('mapPal');if(p){p.style.transitionDuration=ms+'ms';p.style.left=(x-7.5)+'%';p.style.top=(y+1.5)+'%'}
}
let walking=false,busy=false;
async function walkTo(x,y,direct){
  if(walking)return false;
  const pts=[],from=S.pos;
  if(!direct&&F.bridge&&isEast(from.x,from.y)!==isEast(x,y)){const by=53,bx=riverX(by*7)/10;pts.push([isEast(from.x,from.y)?bx+4:bx-4,by+1],[isEast(x,y)?bx+4:bx-4,by+1])}
  pts.push([x,y]);
  walking=true;const els=[$('mapBuddy'),$('mapPal')].filter(Boolean);els.forEach(e=>e.classList.add('walking'));
  for(const[px,py]of pts){const d=Math.hypot(px-S.pos.x,(py-S.pos.y)*.7),ms=reduced()?0:Math.round(Math.min(1500,Math.max(300,d*26)));setBuddy(px,py,ms);S.pos={x:px,y:py};await sleep(ms+40)}
  els.forEach(e=>e.classList.remove('walking'));walking=false;save();return true;
}
function tapGround(e){
  if(walking||busy)return;
  const r=e.currentTarget.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*100,y=(e.clientY-r.top)/r.height*100;
  let onLand=true;try{onLand=$('land').isPointInFill(new DOMPoint(x*10,y*7))}catch(err){}
  if(!onLand){sfx.no();toast('Splash! That’s the sea. Tap the island.');return}
  if(isEast(x,y)!==isEast(S.pos.x,S.pos.y)&&!F.bridge){sfx.no();toast('The river is too deep to cross. Bea the beaver at the bridge can help!');return}
  sfx.tap();walkTo(x,y);
}
async function scene(fn){
  if(walking||busy)return;busy=true;
  try{await fn()}catch(err){console.error(err)}
  finally{busy=false;dlgClose();show(null);renderMap();hud();await flushLevelUps()}
}
function reachable(x,y){return isEast(x,y)===isEast(S.pos.x,S.pos.y)||F.bridge}
function visit(pid){
  if(walking||busy)return;
  const msg=access(pid);if(msg){sfx.no();toast(msg,4000);return}
  if(pid==='lighthouse')return scene(lighthouse);
  const P=place(pid);sfx.tap();
  scene(async()=>{await walkTo(P.x-6,P.y+8);await QUESTS[pid]()});
}
function getTreasure(tid,btn){
  const t=TREASURES.find(t=>t.id===tid);
  if(!reachable(t.x,t.y)){sfx.no();toast('That sparkle is across the river. Bea can help build a bridge!');return}
  scene(async()=>{await walkTo(t.x-2,t.y+5);S.found.push(tid);S.shells+=3;gainXP(10);save();sfx.gift();burst(btn);
    const left=TREASURES.length-S.found.length;
    await line('me',`You found ${t.name}! It’s worth 3 shells.`,{extra:`<div class="loot"><span>${SHELL} +3 shells</span><span>${left?`${left} more hiding on the island`:'You found every treasure!'}</span></div>`,btn:'Yay'})});
}
function dig(did){
  const d=DIGS.find(d=>d.id===did);
  if(!reachable(d.x,d.y)){sfx.no();toast('That X is across the river. Bea can help build a bridge!');return}
  scene(async()=>{
    await walkTo(d.x-2,d.y+5);sfx.dig();
    const q=G[pick(['add','sub','mul','sq','balance'])](Math.max(1,Math.min(3,Math.round(S.lvl/3))));
    const chest={face:ICON.chest,name:'Treasure chest'};
    await ask(chest,`You dug up a treasure chest! It has a number lock. ${q.prompt}`,q);
    const first=S.dug.length===0;S.dug.push(did);
    const st=stats();let sh=rnd(4,8)+(Math.random()<st.luck*.1?3:0);S.shells+=sh;gainXP(15);
    let extra=`<div class="loot"><span>${SHELL} +${sh} shells</span>`;
    const left=ITEMS.filter(i=>i.src==='shop'&&!S.owned.includes(i.id));
    let gift=null;if(left.length&&Math.random()<.3+st.luck*.05){gift=pick(left);give(gift.id);extra+=`<span>+ ${esc(gift.name)}!</span>`}
    extra+='</div>';save();sfx.gift();
    await line(chest,gift?`Click! The lock pops open. Shells and a ${gift.name}!`:'Click! The lock pops open. Shells!',{extra,btn:'Yay'});
    if(first&&!S.critters.includes('mole')){S.critters.push('mole');save();await line({face:`<svg class="face-svg" viewBox="0 0 40 40">${CRIT_ART.mole}</svg>`,name:'Mole'},'A mole popped out of your hole! Moles dig tunnels under the ground. Mole added to your Critter Book!')}
  });
}
function catchCritter(cid){
  const c=CRITTERS.find(c=>c.id===cid);

    await walkTo(c.x-3,c.y+5);

  });
}

      return `<button class="tile ${S.wear[i.slot]===i.id?'on':''}" type="button" data-i="${i.id}">${preview(i)}${esc(i.name)}${bonusTxt(i.bonus)}</button>`;
    }).join('')}</div><p class="note">${setupMode?'Pick a color and an outfit. You can win and buy lots more clothes on the island.':'Some clothes give power-ups. Buy more at Shelly’s shop in the village.'}</p>`;
    P.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{lookSlot=b.dataset.s;sfx.tap();renderMe()});
    P.querySelectorAll('[data-i]').forEach(b=>b.onclick=()=>{const it=item(b.dataset.i);S.wear[it.slot]=it.id;save();sfx.tap();renderMe()});
  }
  else if(meTab==='calling'){
    P.innerHTML=`<p class="note" style="margin:0 0 12px">A calling is your buddy’s special talent. It changes your power-ups.</p><div class="cards">${Object.entries(CALLINGS).map(([k,c])=>`<button class="ccard ${S.calling===k?'on':''}" type="button" data-c="${k}"><span class="mini">${buddySVG({...S.wear,hat:c.hat})}</span><h4>${c.name}</h4><p>${c.desc}</p><p><b>Brains ${c.base.brains} · Power ${c.base.power} · Luck ${c.base.luck}</b></p></button>`).join('')}</div>`;
    P.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{const k=b.dataset.c;S.owned=S.owned.filter(id=>item(id).src!=='calling');S.calling=k;give(CALLINGS[k].hat);S.wear.hat=CALLINGS[k].hat;save();sfx.gift();burst(b);renderMe()});
  }
  else if(meTab==='hero'){
    const st=stats(),c=CALLINGS[S.calling]||CALLINGS.explorer;
    const gear=Object.values(S.wear).map(item).filter(i=>i&&i.bonus);
    P.innerHTML=`<div class="stack"><div class="hero-head"><div><h3>${esc(S.name)} the ${c.name}</h3><p class="note" style="margin:4px 0 0">Level ${S.lvl} · ${S.xp} of ${needXP(S.lvl)} XP to the next level</p></div><div class="bigxp"><i style="width:${Math.min(100,S.xp/needXP(S.lvl)*100)}%"></i></div></div>
      ${STATS.map(([k,n,d])=>`<div class="statrow"><b>${n}</b><span class="num">${st[k]}</span><p>${d}</p></div>`).join('')}
      <p class="note" style="margin:0">${gear.length?'Power-ups from your clothes: '+gear.map(i=>`${esc(i.name)} (${Object.entries(i.bonus).map(([k,v])=>`+${v} ${cap(k)}`).join(', ')})`).join(', ')+'.':'Tip: some hats and clothes give power-ups.'} Level up by answering questions. Each level lets you pick +1 to a stat.</p></div>`;
  }
  else if(meTab==='friends'){
    P.innerHTML=S.pals.length?`<div class="cards">${S.pals.map(k=>`<button class="ccard ${S.pal===k?'on':''}" type="button" data-p="${k}"><span class="mini">${face(k)}</span><h4>${PALS[k].name}</h4><p>${PALS[k].desc}</p><p><b>${S.pal===k?'Adventuring with you':'Tap to bring along'}</b></p></button>`).join('')}</div><p class="note">One friend can come along at a time. They follow you on the map and help in puzzles.</p>`
      :'<p class="note" style="margin:0">No friends on your team yet. Help the island friends and some of them will want to join you!</p>';
    P.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.pal=b.dataset.p;save();sfx.gift();renderMe()});
  }
  else if(meTab==='bag'){
    const card=(icon,name,desc,on=true)=>`<div class="ccard" style="${on?'':'opacity:.45'}"><span style="width:60px">${icon}</span><h4 style="font-size:20px">${name}</h4><p>${desc}</p></div>`;
    const gemNames={woods:'Woods gem',garden:'Garden gem',peak:'Peak gem',cave:'Cave gem'};
    P.innerHTML=`<div class="cards">${Object.keys(gemNames).map(g=>card(BIG(GEM(F[g+'Gem']?GEMCOL[g]:'#ddd8c6')),gemNames[g],F[g+'Gem']?'Found!':'Still lost somewhere…',F[g+'Gem'])).join('')}
      ${card(ICON.shovel,'Shovel',F.shovel?`Dig at red X marks. Dug ${S.dug.length} of ${DIGS.length}.`:'Bun in Plus Meadow has one.',F.shovel)}
      ${card(ICON.lantern,'Lantern',F.lantern?'Lights up the Crystal Cave.':'Professor Hoot has one.',F.lantern)}
      ${card(BIG(SHELL),`${S.shells} shells`,'Spend them at Shelly’s shop.')}
      ${card(`<svg viewBox="0 0 40 40">${SPARK.replace(/<\/?svg[^>]*>/g,'')}</svg>`,'Treasures',`${S.found.length} of ${TREASURES.length} found`)}</div>`;
  }
  else if(meTab==='critters'){
    P.innerHTML=`<p class="note" style="margin:0 0 12px">Critters found: ${S.critters.length} of ${CRITTERS.length}. Some only come out at night. Tap the time button on the map to wait.</p><div class="tiles">${CRITTERS.map(c=>{const f=S.critters.includes(c.id);return `<div class="tile crit-tile ${f?'':'unknown'}">${critSVG(c.id)}<span>${f?c.name:'???'}</span><small>${f?c.fact:'Look '+c.where+'.'}</small></div>`}).join('')}</div>`;
  }
}
$('nameInput').addEventListener('input',e=>{S.name=e.target.value.trim()||'Buddy';save();if(setupMode)$('startNote').textContent=S.calling?`${CALLINGS[S.calling].name} ${S.name} is ready!`:$('startNote').textContent});
$('meBack').onclick=()=>{sfx.tap();show(null);renderMap();hud()};
$('startBtn').onclick=()=>{if(!S.calling)return;S.made=true;setupMode=false;save();sfx.gift();show(null);renderMap();hud();if(!F.intro)setTimeout(()=>scene(async()=>{await walkTo(place('dock').x+4,place('dock').y+8);await intro()}),400)};

/* ---------- developer options ---------- */
let resetArmed=false,resetTimer;
function renderDev(){
  const b=(id,label,cls='')=>`<button class="pill ${cls}" type="button" id="${id}">${label}</button>`;
  $('devBody').innerHTML=`<h4>Testing</h4>${b('dvSkip',S.devSkip?'Skip button in rounds: ON':'Skip button in rounds: off',S.devSkip?'sun':'')}
    ${b('dvShells','Give 25 shells')}${b('dvLevel','Level up once')}${b('dvTime',`Change time (now ${TIMES[S.time]})`)}
    <h4>Story shortcuts</h4>${b('dvTools','Get shovel, lantern and bridge')}${b('dvGems','Get all 4 Light Gems')}${b('dvOutfits','Win every outfit')}${b('dvCritters','Find every critter')}${b('dvCalling','Change calling and look')}
    <h4>Start over</h4>${b('dvLevels','Set every place back to level 1')}${b('dvReset',resetArmed?'Tap again to erase everything':'Reset everything','danger')}
    <p class="note">Level ${S.lvl} ${S.calling||''} · ${S.shells} shells · gems ${gems()}/4 · critters ${S.critters.length}/${CRITTERS.length} · rounds played ${S.rounds}</p>`;
  const on=(id,fn)=>$(id).onclick=()=>{sfx.tap();fn();save();hud();renderDev()};
  on('dvSkip',()=>{S.devSkip=!S.devSkip});
  on('dvShells',()=>{S.shells+=25;toast('Added 25 shells.')});
  on('dvLevel',()=>{gainXP(needXP(S.lvl)-S.xp);flushLevelUps()});
  on('dvTime',()=>{S.time=(S.time+1)%4});
  on('dvTools',()=>{F.intro=1;F.shovel=1;F.lantern=1;F.bridge=F.bridge||'rope';give('hardhat');if(!S.pals.includes('hoot'))S.pals.push('hoot');toast('Tools and bridge ready.')});
  on('dvGems',()=>{F.intro=1;['woods','garden','peak','cave'].forEach(g=>F[g+'Gem']=1);F.bridge=F.bridge||'rope';F.lantern=1;F.shovel=1;F.plant=F.plant||'sun';F.pip=F.pip||'share';F.echoMet=1;['pip','hoot','echo'].forEach(p=>{if(!S.pals.includes(p))S.pals.push(p)});toast('All 4 gems! Head to the dock.')});
  on('dvOutfits',()=>{S.owned=[...new Set([...S.owned,...ITEMS.filter(i=>i.src!=='calling').map(i=>i.id),CALLINGS[S.calling||'explorer'].hat])];toast('Every outfit is in the closet.')});
  on('dvCritters',()=>{S.critters=CRITTERS.map(c=>c.id);toast('Every critter found.')});
  $('dvCalling').onclick=()=>{sfx.tap();openSetup()};
  on('dvLevels',()=>{Object.keys(S.levels).forEach(k=>S.levels[k]=1);S.levels.lighthouse=2;toast('Every place is back to level 1.')});
  $('dvReset').onclick=()=>{
    if(!resetArmed){resetArmed=true;renderDev();clearTimeout(resetTimer);resetTimer=setTimeout(()=>{resetArmed=false;if(!$('dev').hidden)renderDev()},4000);return}
    clearTimeout(resetTimer);resetArmed=false;
    try{localStorage.removeItem(KEY)}catch(e){}
    S=JSON.parse(JSON.stringify(DEFAULT));F=S.flags;save();sfx.tap();renderMap();hud();openSetup();toast('Back to the start. Make a new buddy!');
  };
}
$('devBtn').onclick=()=>{sfx.tap();resetArmed=false;renderDev();show('dev')};
$('devBack').onclick=()=>{sfx.tap();show(null);renderMap();hud()};

/* ---------- top bar ---------- */
$('buddyBtn').onclick=()=>{sfx.tap();openMe('look')};
$('lvChip').onclick=()=>{sfx.tap();openMe('hero')};
$('timeBtn').onclick=()=>{if(busy||walking)return;S.time=(S.time+1)%4;save();sfx.tap();renderMap();hud();toast(`You wait a while. Now it’s ${TIMES[S.time].toLowerCase()}.`)};
$('soundBtn').onclick=()=>{S.sound=!S.sound;save();soundLabel();sfx.tap()};

/* ---------- start ---------- */
load();F=S.flags;
$('shellIc').innerHTML=SHELL;$('shopShellIc').innerHTML=SHELL;
soundLabel();renderMap();hud();
if(!S.made)openSetup();
else if(!F.intro)scene(async()=>{await intro()});
else if(S.pendingLv)flushLevelUps();
window.__mb={get S(){return S},G,picHTML};
})();
</script>
